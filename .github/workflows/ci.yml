name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-postgres:
    name: Backend Tests & PostgreSQL Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paypilot_test
          POSTGRES_PASSWORD: test_password_secure_123
          POSTGRES_DB: paypilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://paypilot_test:test_password_secure_123@localhost:5432/paypilot_test
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Run Full Pytest Suite with Strict PostgreSQL Verification
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://paypilot_test:test_password_secure_123@localhost:5432/paypilot_test
          REQUIRE_POSTGRES: "1"
        run: |
          pytest backend/tests

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

