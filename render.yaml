# Render Infrastructure-as-Code Blueprint for PayPilot
# Official Hackathon Partner: https://paypalaihackathon.devpost.com/details/render
# Deploys FastAPI backend, Next.js frontend, background worker, PostgreSQL, and Redis.

services:
  # ---------------------------------------------------------------------------
  # 1. PayPilot Backend Web Service (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: paypilot-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend
      - key: APP_NAME
        value: PayPilot
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: AUTH_MODE
        value: demo
      - key: DEMO_AUTH_ALLOWED_IN_PROD
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: paypilot-redis
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://paypilot-lac.vercel.app,https://paypilot-frontend.onrender.com,http://localhost:3000"

  # ---------------------------------------------------------------------------
  # 2. PayPilot Frontend Web Service (Next.js 14)
  # ---------------------------------------------------------------------------
  - type: web
    name: paypilot-frontend
    runtime: node
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        value: https://paypilot-backend-sf0a.onrender.com
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false

  # ---------------------------------------------------------------------------
  # 3. PayPilot Background Worker (Transactional Outbox & Post-Purchase)
  # ---------------------------------------------------------------------------
  - type: worker
    name: paypilot-outbox-worker
    runtime: python
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.workers.outbox_worker
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString
      - key: ZAPIER_WEBHOOK_URL
        sync: false

databases:
  # ---------------------------------------------------------------------------
  # 4. PayPilot Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: paypilot-db
    region: oregon
    plan: starter
    databaseName: paypilot
    user: paypilot_admin

  # ---------------------------------------------------------------------------
  # 5. PayPilot Managed Redis Cache
  # ---------------------------------------------------------------------------
  - name: paypilot-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru

